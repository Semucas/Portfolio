<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sebastián Muñoz — Ingeniería &amp; Negocio</title>
<link rel="icon" type="image/png" href="assets/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --ink-soft:#2B3B5C;
    --paper:#F3F3EF;
    --paper-raised:#FFFFFF;
    --slate:#5C6270;
    --rule:#D8D6CE;
    --ledger:#2F6F5E;
    --ledger-deep:#1E4A3F;
    --ledger-tint:#E4EEEA;
    --error:#B3261E;
    --max:960px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.6;
  }

  h1,h2,h3{
    font-family:'Newsreader', serif;
    font-weight:500;
    margin:0;
    color:var(--ink);
  }

  a{color:inherit;}

  .caption{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ledger-deep);
  }

  /* LAYOUT */
  .layout{
    display:flex;
    max-width:1280px;
    margin:0 auto;
  }

  .sidebar{
    position:sticky;
    top:0;
    height:100vh;
    width:280px;
    flex-shrink:0;
    padding:48px 18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    border-right:1px solid var(--rule);
    overflow-y:auto;
  }

  .avatar{
    width:160px;
    height:160px;
    border-radius:50%;
    background:var(--ledger-tint);
    border:1.5px solid var(--ledger);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Newsreader', serif;
    font-size:2rem;
    color:var(--ledger-deep);
    margin:0 auto 20px;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  .sidebar-top .name{
    font-size:1.5rem;
    line-height:1.25;
  }
  .sidebar-top .role{
    margin-top:10px;
    font-size:0.95rem;
    color:var(--slate);
    max-width:22ch;
  }

  .lang-toggle{
    margin-top:22px;
    display:inline-flex;
    align-items:center;
    gap:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    border:1px solid var(--ledger);
    border-radius:14px;
    overflow:hidden;
    background:var(--paper-raised);
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    padding:6px 14px;
    cursor:pointer;
    color:var(--slate);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.05em;
    transition:background .15s ease, color .15s ease;
  }
  .lang-toggle button.active{
    background:var(--ledger-deep);
    color:var(--paper-raised);
  }
  .lang-toggle button:focus-visible{ outline:2px solid var(--ledger-deep); outline-offset:2px; }

  nav.index{
    margin-top:40px;
  }
  nav.index a{
    display:flex;
    gap:12px;
    align-items:baseline;
    text-decoration:none;
    padding:9px 0;
    font-size:0.92rem;
    color:var(--slate);
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.index a .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--rule);
    width:20px;
  }
  nav.index a:hover, nav.index a:focus-visible, nav.index a.active{
    color:var(--ledger-deep);
  }
  nav.index a.active .num{ color:var(--ledger); }

  .sidebar-bottom{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.92rem;
  }
  .sidebar-bottom a{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--ink-soft);
    padding:6px 0;
    border-bottom:1px dashed var(--rule);
    transition:color .15s ease;
    overflow-wrap:anywhere;
  }
  .sidebar-bottom a:hover, .sidebar-bottom a:focus-visible{ color:var(--ledger); }
  .sidebar-bottom a img{
    width:28px;
    height:28px;
    flex-shrink:0;
    object-fit:contain;
  }

  main{
    flex:1;
    min-width:0;
    padding:48px 56px 120px;
  }

  section{
    max-width:var(--max);
    padding-top:64px;
    scroll-margin-top:24px;
  }
  section:first-of-type{ padding-top:8px; }

  .section-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    border-bottom:1px solid var(--rule);
    padding-bottom:14px;
    margin-bottom:32px;
  }
  .section-head .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--ledger);
    letter-spacing:0.1em;
  }
  .section-head h2{ font-size:1.7rem; }

  /* HERO */
  .hero h1{
    font-size:2.6rem;
    line-height:1.2;
    max-width:18ch;
  }
  .hero .lede{
    margin-top:22px;
    max-width:62ch;
    font-size:1.08rem;
    color:var(--ink-soft);
  }
  .hero .highlight{
    background:linear-gradient(to bottom, transparent 60%, var(--ledger-tint) 60%);
  }
  .stat-row{
    margin-top:36px;
    display:flex;
    gap:36px;
    flex-wrap:wrap;
  }
  .stat{
    font-family:'IBM Plex Mono', monospace;
  }
  .stat .n{
    font-family:'Newsreader', serif;
    font-size:1.6rem;
    color:var(--ledger-deep);
    display:block;
  }
  .stat .l{
    font-size:0.72rem;
    color:var(--slate);
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .like-stat{
    background:var(--ledger-tint);
    border:1px solid var(--ledger);
    border-radius:8px;
    padding:10px 18px;
    margin:0;
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .like-stat .n{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:2.1rem;
  }
  .like-icon{ display:inline-flex; width:24px; height:24px; }
  .like-icon svg{ width:100%; height:100%; }
  .like-standalone{
    max-width:var(--max);
    padding-top:64px;
    display:flex;
    justify-content:center;
  }
  .like-stat--lg{ padding:22px 44px; }
  .like-stat--lg .n{ font-size:3.2rem; gap:12px; }
  .like-stat--lg .like-icon{ width:38px; height:38px; }
  .like-stat--lg .l{ font-size:0.8rem; }
  .like-stat:not(:disabled):hover{ background:var(--ledger-tint); border-color:var(--ledger-deep); }
  .like-stat:not(:disabled):hover .n{ color:var(--ledger); }
  .like-stat:disabled{ cursor:default; }

  /* ENTRY (experience / education) */
  .entry{
    display:grid;
    grid-template-columns:140px 1fr;
    gap:24px;
    padding:22px 0;
    border-bottom:1px solid var(--rule);
  }
  .entry:last-child{ border-bottom:none; }
  .entry .when{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    color:var(--slate);
    padding-top:2px;
  }
  .entry .role{
    font-size:1.08rem;
    font-weight:600;
    color:var(--ink);
  }
  .entry .org{
    color:var(--ledger-deep);
    font-size:0.92rem;
    margin-top:2px;
  }
  .entry p{
    margin:10px 0 0;
    color:var(--ink-soft);
    font-size:0.95rem;
    max-width:58ch;
  }
  .entry .tags{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .entry .tags span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color:var(--ledger-deep);
    background:var(--ledger-tint);
    padding:3px 8px;
    border-radius:2px;
  }
  .grade-flag{
    display:inline-block;
    margin-top:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ledger-deep);
    border:1px solid var(--ledger);
    padding:2px 8px;
    border-radius:2px;
  }

  /* PROJECTS */
  .project{
    position:relative;
    border:1px solid var(--rule);
    background:var(--paper-raised);
    padding:28px 30px;
    margin-bottom:26px;
  }
  .project .stamp{
    position:absolute;
    top:22px;
    right:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--ledger);
    border:1.5px solid var(--ledger);
    padding:5px 10px;
    border-radius:3px;
    transform:rotate(4deg);
    opacity:0.85;
  }
  .project h3{ font-size:1.28rem; max-width:70%; }
  .project .stack{
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    color:var(--slate);
  }
  .project .case{
    margin-top:16px;
    display:grid;
    gap:10px;
  }
  .project .case div{ font-size:0.93rem; }
  .project .case .k{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ledger-deep);
    display:block;
    margin-bottom:2px;
  }
  .project .links{
    margin-top:18px;
    display:flex;
    gap:18px;
  }
  .project .links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    text-decoration:none;
    color:var(--ink);
    border-bottom:1px solid var(--ink);
    padding-bottom:1px;
  }
  .project .links a:hover, .project .links a:focus-visible{ color:var(--ledger-deep); border-color:var(--ledger-deep); }

  /* SKILLS */
  .skills-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
  }
  .skill-cell{
    background:var(--paper-raised);
    padding:22px 24px;
  }
  .skill-cell h4{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:1.05rem;
    margin-bottom:10px;
  }
  .skill-cell ul{
    margin:0;
    padding-left:18px;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .skill-cell li{ margin-bottom:5px; }

  /* CONTACT */
  .contact-box{
    border:1px solid var(--rule);
    padding:40px;
    background:var(--paper-raised);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:24px;
  }
  .contact-box h2{ font-size:1.7rem; max-width:32ch; }
  .contact-form{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:480px;
  }
  .contact-form input,
  .contact-form textarea{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:12px 14px;
    resize:vertical;
  }
  .contact-form input:focus,
  .contact-form textarea:focus{
    outline:none;
    border-color:var(--ledger);
  }
  .cta{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    letter-spacing:0.04em;
    text-decoration:none;
    color:var(--paper-raised);
    background:var(--ledger-deep);
    padding:14px 22px;
    border:none;
    border-radius:3px;
    cursor:pointer;
    align-self:flex-start;
    transition:background .15s ease;
  }
  .cta:hover, .cta:focus-visible{ background:var(--ledger); }
  .cta:disabled{
    opacity:0.6;
    cursor:not-allowed;
    background:var(--ledger-deep);
  }
  .form-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    min-height:1.2em;
  }
  .form-status.success{ color:var(--ledger-deep); }
  .form-status.error{ color:var(--error); }

  footer{
    max-width:var(--max);
    padding:40px 0 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--slate);
  }

  /* MOBILE NAV */
  .mobile-bar{ display:none; }
  .mobile-lang{ display:none; }

  @media (max-width: 860px){
    .layout{ flex-direction:column; }
    .sidebar{
      position:sticky;
      height:auto;
      width:auto;
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      padding:16px 20px;
      border-right:none;
      border-bottom:1px solid var(--rule);
      background:var(--paper);
      z-index:10;
    }
    .sidebar-top{ display:flex; align-items:center; gap:12px; }
    .avatar{ width:40px; height:40px; font-size:0.95rem; margin:0; }
    .sidebar-top .role, nav.index, .sidebar-bottom, .lang-toggle{ display:none; }
    .mobile-lang{ display:inline-flex; }
    main{ padding:32px 20px 100px; }
    .entry{ grid-template-columns:1fr; gap:6px; }
    .skills-grid{ grid-template-columns:1fr; }
    .project h3{ max-width:100%; }
    .project .stamp{ position:static; display:inline-block; margin-top:10px; transform:rotate(0deg); }
    .contact-form{ max-width:100%; }
    .mobile-bar{
      display:flex;
      gap:14px;
      overflow-x:auto;
      font-family:'IBM Plex Mono', monospace;
      font-size:0.75rem;
      padding:0 20px 14px;
    }
    .mobile-bar a{ text-decoration:none; color:var(--slate); white-space:nowrap; }
  }

  .fade-in{
    opacity:0;
    transform:translateY(10px);
    animation:fadeIn .6s ease forwards;
  }
  @keyframes fadeIn{ to{ opacity:1; transform:none; } }
</style>

<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="avatar"><img src="assets/avatar.png" alt="Sebastián Muñoz"></div>
      <div>
        <div class="name">Sebastián Muñoz</div>
        <div class="role" data-i18n="role"></div>
        <div class="lang-toggle" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>

    <div>
      <nav class="index" id="indexNav">
        <a href="#perfil" data-target="perfil"><span class="num">01</span> <span data-i18n="nav_perfil"></span></a>
        <a href="#experiencia" data-target="experiencia"><span class="num">02</span> <span data-i18n="nav_experiencia"></span></a>
        <a href="#educacion" data-target="educacion"><span class="num">03</span> <span data-i18n="nav_educacion"></span></a>
        <a href="#proyectos" data-target="proyectos"><span class="num">04</span> <span data-i18n="nav_proyectos"></span></a>
        <a href="#habilidades" data-target="habilidades"><span class="num">05</span> <span data-i18n="nav_habilidades"></span></a>
        <a href="#contacto" data-target="contacto"><span class="num">06</span> <span data-i18n="nav_contacto"></span></a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <a href="mailto:semucas27@gmail.com"><img src="assets/mail-icon.png" alt="">semucas27@gmail.com</a>
      <a href="https://github.com/Semucas" target="_blank" rel="noopener"><img src="assets/github.png" alt="">github.com/Semucas</a>
      <a href="https://www.linkedin.com/in/semucas/" target="_blank" rel="noopener"><img src="assets/linkedin.png" alt="">linkedin.com/in/semucas</a>
    </div>
  </aside>

  <main>

    <div class="mobile-bar">
      <a href="#perfil" data-i18n="nav_perfil"></a>
      <a href="#experiencia" data-i18n="nav_experiencia"></a>
      <a href="#educacion" data-i18n="nav_educacion"></a>
      <a href="#proyectos" data-i18n="nav_proyectos"></a>
      <a href="#habilidades" data-i18n="nav_habilidades"></a>
      <a href="#contacto" data-i18n="nav_contacto"></a>
      <span class="lang-toggle mobile-lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </span>
    </div>

    <section id="perfil" class="hero fade-in">
      <h1 style="margin-top:14px;">
        <span data-i18n="hero_h1_a"></span> <span class="highlight" data-i18n="hero_h1_b"></span>
      </h1>
      <p class="lede" data-i18n="hero_lede"></p>

      <div class="stat-row">
        <div class="stat"><span class="n">4.4</span><span class="l" data-i18n="stat_gpa"></span></div>
        <div class="stat"><span class="n">5+</span><span class="l" data-i18n="stat_tutor"></span></div>
        <div class="stat"><span class="n">100%</span><span class="l" data-i18n="stat_saberpro"></span></div>
      </div>
    </section>

    <section id="experiencia" class="fade-in">
      <div class="section-head">
        <h2 data-i18n="nav_experiencia"></h2>
      </div>

      <div class="entry">
        <div class="when" data-i18n="exp1_when"></div>
        <div>
          <div class="role" data-i18n="exp1_role"></div>
          <div class="org" data-i18n="exp1_org"></div>
          <p data-i18n="exp1_desc"></p>
          <div class="tags"><span data-i18n="exp1_tag1"></span><span data-i18n="exp1_tag2"></span></div>
        </div>
      </div>

      <div class="entry">
        <div class="when" data-i18n="exp2_when"></div>
        <div>
          <div class="role" data-i18n="exp2_role"></div>
          <div class="org" data-i18n="exp2_org"></div>
          <p data-i18n="exp2_desc"></p>
          <div class="tags"><span data-i18n="exp2_tag1"></span></div>
        </div>
      </div>

      <div class="entry">
        <div class="when" data-i18n="exp3_when"></div>
        <div>
          <div class="role" data-i18n="exp3_role"></div>
          <div class="org" data-i18n="exp3_org"></div>
          <p data-i18n="exp3_desc"></p>
          <div class="tags"><span data-i18n="exp3_tag1"></span><span data-i18n="exp3_tag2"></span></div>
        </div>
      </div>

      <div class="entry">
        <div class="when" data-i18n="exp4_when"></div>
        <div>
          <div class="role" data-i18n="exp4_role"></div>
          <div class="org" data-i18n="exp4_org"></div>
          <p data-i18n="exp4_desc"></p>
          <div class="tags"><span data-i18n="exp4_tag1"></span><span data-i18n="exp4_tag2"></span></div>
        </div>
      </div>
    </section>

    <section id="educacion" class="fade-in">
      <div class="section-head">
        <h2 data-i18n="nav_educacion"></h2>
      </div>

      <div class="entry">
        <div class="when" data-i18n="edu1_when"></div>
        <div>
          <div class="role" data-i18n="edu1_role"></div>

  const likeIcon = document.getElementById('likeIcon');

  const THUMB_OUTLINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 0 1 2.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 0 0 .322-1.672V3a.75.75 0 0 1 .75-.75A2.25 2.25 0 0 1 16.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 0 1-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 0 0-1.423-.23H5.904M14.25 9h2.25M5.904 18.75c.083.205.173.405.27.602.197.4-.078.898-.523.898h-.908c-.889 0-1.713-.518-1.972-1.368a12 12 0 0 1-.521-3.507c0-1.553.295-3.036.831-4.398C3.387 10.203 4.167 9.75 5 9.75h1.053c.472 0 .745.556.5.96a8.958 8.958 0 0 0-1.302 4.665c0 1.194.232 2.333.654 3.375Z"/></svg>';
  const THUMB_SOLID = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M1 8.25a1.25 1.25 0 1 1 2.5 0v7.5a1.25 1.25 0 1 1-2.5 0v-7.5ZM11 3V1.7c0-.268.14-.526.395-.607A2 2 0 0 1 14 3c0 .995-.182 1.948-.514 2.826-.204.54.166 1.174.744 1.174h2.52c1.243 0 2.261 1.01 2.146 2.247a23.864 23.864 0 0 1-1.341 5.974C17.153 16.323 16.072 17 14.9 17h-3.192a3 3 0 0 1-1.341-.317l-2.734-1.366A3 3 0 0 0 6.292 15H5V8h.963c.685 0 1.258-.483 1.612-1.068a4.011 4.011 0 0 1 2.166-1.73c.432-.143.853-.386 1.011-.814.16-.432.248-.9.248-1.388Z"/></svg>';

  function setLikedUI(liked){
    likeIcon.innerHTML = liked ? THUMB_SOLID : THUMB_OUTLINE;
    likeBtn.disabled = liked;
    likeBtn.setAttribute('aria-pressed', liked ? 'true' : 'false');
  }

  async function loadLikeCount(){
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/portfolio_likes?select=count&id=eq.main`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      });
      const data = await res.json();
      if(Array.isArray(data) && data[0] && typeof data[0].count === 'number'){
        likeCount.textContent = data[0].count;
      }
    } catch(err){
      // deja el placeholder si falla la carga inicial
    }
  }

  setLikedUI(localStorage.getItem('portfolioLiked') === 'true');
  loadLikeCount();

  likeBtn.addEventListener('click', async () => {
    if(localStorage.getItem('portfolioLiked') === 'true') return;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_portfolio_like`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      const newCount = typeof data === 'number' ? data : (Array.isArray(data) ? data[0] : data && data.count);

      if(typeof newCount === 'number') likeCount.textContent = newCount;
      localStorage.setItem('portfolioLiked', 'true');
      setLikedUI(true);
    } catch(err){
      // si falla, el boton sigue habilitado para reintentar
    }
  });
</script>

</body>
</html>
